spring.application.name=Insurance_Management_Rest

spring.datasource.url=jdbc:postgresql://localhost:5432/insurance_db
spring.datasource.username=postgres
spring.datasource.password=progrec123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8080

# ---------- Logging ----------
# root level for everything (Spring, Hibernate...)
logging.level.root=INFO
# our own code - DEBUG shows extra details like fetch counts
logging.level.com.Dcl=DEBUG

# log file (also prints in console) - logs/nexsure.log inside backend folder
logging.file.name=logs/nexsure.log
# new file every 10MB, keep 7 days of old files
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %highlight(%-5level) [%thread] %cyan(%logger{36}) - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

logging.level.com.Dcl.service.impl.ClaimServiceImpl=TRACE
