
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cab Fare Calculator</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div class="container">

        <h1>Cab Fare Calculator</h1>
        <p class="subtitle">Calculate Your Trip Fare</p>

        <form id="fareForm">

            <label for="carType">Select Car Type</label>
            <select id="carType" required>
                <option value="">Select Car</option>
                <option value="mini">Mini - ₹50</option>
                <option value="suv">SUV - ₹70</option>
                <option value="sedan">Sedan - ₹90</option>
            </select>

            <label for="distance">Distance (KM)</label>
            <input type="number" id="distance"
                   placeholder="Enter distance"
                   min="0.1" step="0.1" required>

            <label>Waiting Time?</label>

            <div class="options">
                <label>
                    <input type="radio" name="waiting" value="yes">
                    Yes
                </label>

                <label>
                    <input type="radio" name="waiting" value="no" checked>
                    No
                </label>
            </div>

            <div id="waitingField" class="hidden">
                <label for="waitingMinutes">Waiting Minutes</label>
                <input type="number" id="waitingMinutes"
                       placeholder="Enter waiting minutes"
                       min="0" step="1">
            </div>

            <label>Night Trip?</label>

            <div class="options">
                <label>
                    <input type="checkbox" id="nightTrip">
                    Yes
                </label>
            </div>

            <label for="feedback">Feedback</label>
            <textarea id="feedback"
                      rows="3"
                      placeholder="Enter your feedback"></textarea>

            <button type="submit">Calculate Fare</button>

        </form>

        <div id="result" class="result hidden">

            <h2>Fare Details</h2>

            <div id="fareBreakdown"></div>

            <p id="feedbackResult"></p>

            <h2 id="totalFare"></h2>

        </div>

        <button type="button" id="logoutButton" class="logout">
            Logout
        </button>

    </div>

    <script src="./script.js"></script>

</body>
</html>
